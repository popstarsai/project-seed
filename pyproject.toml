[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "project-seed"
version = "0.1.0a1"
description = "Explicit, permission-scoped context activation for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Project Seed contributors"}]
dependencies = ["jsonschema>=4.23,<5", "rfc3339-validator>=0.1.4,<0.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
dev = ["pytest==9.2.0", "ruff==0.17.4", "build==1.6.1"]

[project.scripts]
project-seed = "project_seed.cli:main"
project-seed-mcp = "project_seed.mcp_server:main"

[project.urls]
Repository = "https://github.com/popstarsai/project-seed"
Issues = "https://github.com/popstarsai/project-seed/issues"
Specification = "https://github.com/popstarsai/project-seed/blob/main/specifications.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_seed = ["schemas/*.json", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

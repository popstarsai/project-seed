name: Bug report
description: Report a reproducible, non-sensitive problem.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Never include private memories, tokens, or credentials."
  - type: input
    id: version
    attributes:
      label: Commit and environment
      description: Commit SHA, Python version, operating system, and MCP SDK version if applicable.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Small commands and synthetic inputs that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
